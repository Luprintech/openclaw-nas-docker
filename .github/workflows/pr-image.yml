name: PR image smoke test

# Construye la imagen del PR y le pasa el smoke test (arranque limpio y
# actualización desde :latest) cuando el PR cambia algo que entra en la imagen
# o en la migración. Así un cambio en el Dockerfile no llega a main sin probar.

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - .last-openclaw-version
      - scripts/smoke-test.sh
      - scripts/migrate-openclaw.sh
      - .github/workflows/pr-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/luprintech/openclaw-nas-docker

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read OpenClaw version
        id: version
        run: echo "version=$(tr -d '[:space:]' < .last-openclaw-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/amd64
          build-args: |
            OPENCLAW_VERSION=${{ steps.version.outputs.version }}
          tags: openclaw-pr:test

      - name: Smoke test (clean start + upgrade from stable)
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh openclaw-pr:test "${GHCR_IMAGE}:latest"
