name: Update OpenClaw version

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Check and update version pins
        id: check
        run: |
          chmod +x scripts/update-openclaw-version.sh
          scripts/update-openclaw-version.sh --propose
          if git diff --quiet .last-openclaw-version; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(tr -d '[:space:]' < .last-openclaw-version)"
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Open version update PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/openclaw-${{ steps.check.outputs.version }}
          delete-branch: true
          commit-message: "chore: propose OpenClaw ${{ steps.check.outputs.version }}"
          title: "chore: propose OpenClaw ${{ steps.check.outputs.version }}"
          labels: type:chore
          body: |
            ## Automated OpenClaw version proposal

            This PR was created automatically after detecting OpenClaw `${{ steps.check.outputs.version }}`.

            The image is **not** published until this PR is reviewed and merged.

            ### Synology validation required

            - [ ] Test the candidate on a clean Synology installation.
            - [ ] Test the upgrade and migration path.
            - [ ] Confirm the gateway reaches `ready` and Docker reports `healthy`.
            - [ ] Confirm the HTTPS Control UI and browser approval flow.

            After merging, the Docker publish workflow will build and publish the approved version.
