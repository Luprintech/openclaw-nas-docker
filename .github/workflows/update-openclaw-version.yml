name: Update OpenClaw version

# Flujo automático:
#   detectar versión nueva -> construir candidata -> smoke test ->
#   si pasa: fijarla en main (vía PR) y publicarla como :<versión> y :edge;
#   si falla: abrir un issue.
# :latest no se toca aquí: lo mueve promote.yml tras validar en un Synology.

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # lanzamiento manual desde la UI de GitHub

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

# Evita que dos ejecuciones se pisen (por ejemplo cron + manual).
concurrency:
  group: update-openclaw-version
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/luprintech/openclaw-nas-docker

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Check latest OpenClaw version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update-openclaw-version.sh
          scripts/update-openclaw-version.sh

          if git diff --quiet .last-openclaw-version; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(tr -d '[:space:]' < .last-openclaw-version)"

          # Si esta versión ya falló y el issue sigue abierto, no se repite
          # el test cada 6 horas. Cerrar el issue vuelve a habilitarla.
          OPEN="$(gh issue list --state open --label openclaw-update-failed \
            --search "\"OpenClaw ${VERSION}\" in:title" --json number --jq 'length')"
          if [[ "$OPEN" != "0" ]]; then
            echo "OpenClaw ${VERSION} ya falló y tiene un issue abierto, se omite."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/amd64
          build-args: |
            OPENCLAW_VERSION=${{ needs.detect.outputs.version }}
          tags: openclaw-candidate:${{ needs.detect.outputs.version }}

      # La actualización se prueba desde :latest, que es lo que tienen
      # instalado los usuarios.
      - name: Smoke test (clean start + upgrade from stable)
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh \
            "openclaw-candidate:${{ needs.detect.outputs.version }}" \
            "${{ env.GHCR_IMAGE }}:latest"

  release:
    needs: [detect, validate]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # main está protegida y solo acepta cambios por PR, así que el bot
      # abre uno y lo fusiona en el momento.
      - name: Pin validated version on main (via PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          BRANCH="release/openclaw-${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          echo "$VERSION" > .last-openclaw-version
          git add .last-openclaw-version
          git commit -m "chore: update OpenClaw to ${VERSION}"
          git push --force origin "$BRANCH"

          PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$PR" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update OpenClaw to ${VERSION}" \
              --body "Versión validada por el smoke test en ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Se fusiona automáticamente."
          fi

          # Los PR abiertos con GITHUB_TOKEN no disparan pull_request, así que
          # el check obligatorio de main se lanza a mano sobre esta rama y se
          # espera a que pase antes de fusionar.
          SHA="$(git rev-parse HEAD)"
          gh workflow run pr-checks.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 5
            RUN_ID="$(gh run list --workflow pr-checks.yml --branch "$BRANCH" \
              --event workflow_dispatch --json databaseId,headSha \
              --jq "map(select(.headSha == \"$SHA\")) | .[0].databaseId // empty")"
            [[ -n "$RUN_ID" ]] && break
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::PR checks did not start for $SHA"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

          gh pr merge "$BRANCH" --squash --delete-branch

      # Los pushes hechos con GITHUB_TOKEN no disparan otros workflows,
      # así que la publicación se lanza explícitamente.
      - name: Trigger image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --ref main

      - name: Close stale proposal PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/openclaw-")) | .number' |
          while read -r PR; do
            gh pr close "$PR" --delete-branch \
              --comment "Obsoleto: OpenClaw ${VERSION} se validó y publicó automáticamente."
          done

  report-failure:
    needs: [detect, validate, release]
    if: failure() && (needs.validate.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Open issue for failed update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          FAILED_JOB: ${{ needs.validate.result == 'failure' && 'validate' || 'release' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create openclaw-update-failed --color B60205 \
            --description "Automatic OpenClaw update failed" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          if [[ "$FAILED_JOB" == "validate" ]]; then
            TITLE="OpenClaw ${VERSION} failed automatic validation"
            WHAT="no ha superado el smoke test"
          else
            TITLE="OpenClaw ${VERSION} failed automatic release"
            WHAT="ha pasado el smoke test, pero no se ha podido fusionar en \`main\` (puede que quede un PR abierto pendiente de fusionar a mano)"
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --label openclaw-update-failed \
            --title "$TITLE" \
            --body "La versión \`${VERSION}\` ${WHAT}, así que **no** se ha publicado y \`main\` sigue en la versión anterior.

          Logs: ${RUN_URL}

          Se reintentará con la siguiente versión que salga. Para reintentar esta misma, cierra este issue y lanza el workflow a mano."
